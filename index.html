<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonarium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      #back {
        background-color: #ffffff00;
        width: 100%;
        height: 100%;
        position: absolute;
        z-index: 0;
        pointer-events: all;
      }

      body {
        background-color: #000000;
        font-family: "Montserrat", Helvetica, sans-serif, sans-serif;
        color: #cfcfcf;
        margin: 0;
        padding: 20px;
        pointer-events: none;
        overflow: hidden;
      }

      #starsvg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      #star {
        z-index: 2;
        pointer-events: all;
      }

      #trail {
        z-index: 10;
        width: 75px;
        height: 75px;
        position: absolute;
        border: 1px solid #ffffff81;
        border-radius: 100%;
        background-color: #4445830e;
        backdrop-filter: blur(10px);
      }

      #blur {
        opacity: 0.7;
        width: auto;
        height: 100%;
        z-index: -1;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-image: url("rock.png");
      }
    </style>
  </head>

  <body>
    <div id="back"></div>
    <div id="trail"></div>
    <img src="rock.png" alt="blur" id="blur" />
    <svg
      id="starsvg"
      width="612"
      height="607"
      viewBox="0 0 612 607"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
    >
      <path
        id="star"
        d="M269.95 12.1c21.35-16.05 50.75-16.05 72.1 0l245.8 184.77c20.32 15.27 28.81 41.69 21.2 65.94l-94.7 301.56c-7.85 25-31.03 42.01-57.24 42.01H154.9c-26.21 0-49.39-17.01-57.24-42.01L2.95 262.81c-7.61-24.25.88-50.66 21.2-65.94L269.95 12.1Z"
        fill="url(#img)"
      />
      <defs>
        <pattern
          id="img"
          patternUnits="userSpaceOnUse"
          width="650"
          height="650"
        >
          <image href="bg.png" x="0" y="0" width="650" height="650" />
        </pattern>
      </defs>
    </svg>

    <script>
      var inStar = true;
      const P = (x, y) => ({ x, y });
      const body = document.body;
      const trail = document.getElementById("trail");
      const star = document.getElementById("star");
      const starRect = document
        .getElementById("starsvg")
        .getBoundingClientRect();
      const back = document.getElementById("back");
      // const fivePoints = USE THE CODE FROM PC;
      // (306, 0)
      // (606, 226)
      // (495, 595)
      // (120, 595)
      // (6, 226)
      // these are coords with respect to the bounding box client.
      // therefore, dist =  dist(relative.xY, fivePointCoords)

      var mouse = P(window.innerWidth / 2, window.innerHeight / 2);
      var trailer = P(window.outerWidth / 2, window.outerHeight / 2);
      var relative = P(mouse.x - starRect.left, mouse.y - starRect.top);

      body.addEventListener("mousemove", function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        relative.x = mouse.x - starRect.left;
        relative.y = mouse.y - starRect.top;
      });

      function animateTrail() {
        trailer.x += (mouse.x - trailer.x) * 0.1; // Adjust the 0.1 for more or less stagger
        trailer.y += (mouse.y - trailer.y) * 0.1;

        trail.style.left = trailer.x - 75 / 2 + "px";
        trail.style.top = trailer.y - 75 / 2 + "px";
        // THIS CODE HAS BEEN COMMENTED OUT FOR SLOWING DOWN PERFORMANCE. I can be uncommented for lagged trails and more aesthetics.
        // if(inStar){
        //     blur.style.opacity = 0.6;
        // }else{
        //     blur.style.opacity = 0;
        // }

        // if (mouse.x!==trailer.x&&mouse.y!==trailer.y) { // do not use this code. it dose not work.
        requestAnimationFrame(animateTrail);
        // console.log(
        //   `Is inside? ${inStar}. current coords: (${mouse.x}, ${mouse.y}), relative position ${relative.x}, ${relative.y})`
        // );
        // }
      }

      animateTrail();
      back.addEventListener("mousemove", function (e) {
        inStar = false;
      });
      star.addEventListener("mousemove", function (e) {
        inStar = true;
      });
    </script>
  </body>
</html>
